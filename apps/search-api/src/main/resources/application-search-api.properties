# Sobreposicao ao application.properties do core (ADR-0028), ativada pelo main do SearchApiApplication.
# As migrations sao do ingestor: a search-api so sobe com o schema ja migrado (o compose espera o ingestor ficar saudavel).
spring.flyway.enabled=false
# Alertas gravam no outbox, mas quem publica no Kafka e o relay do ingestor: aqui nenhum agendador dispara o relay nem a limpeza.
radar.outbox.relay-enabled=false
