spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# prometheus exige o papel operator, como todo o actuator fora health e info (ADR-0019)
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=radar
management.endpoint.health.probes.enabled=true
# Buckets de latencia da busca para infra/prometheus/rules/slo.yml (le="0.2") e histogram_quantile do dashboard
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,200ms,500ms

# Tracing: sample everything (lower it per environment with MANAGEMENT_TRACING_SAMPLING_PROBABILITY)
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
# why: metrics go out by Prometheus scrape and logs by stdout; only spans are pushed over OTLP
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

radar.outbox.publisher=kafka
radar.outbox.topics.Procurement=radar.procurement.v1
radar.outbox.topics.Alert=radar.alert.v1

# Formato dos eventos no Kafka (ADR-0024). json (padrao): o envelope em texto. avro: Avro com Apicurio no formato de fio da
# Confluent; os consumidores aceitam os dois formatos sempre. O modo cdc fica em JSON (o Debezium nao passa por aqui).
# Aceita json ou avro, em qualquer caixa; outro valor derruba a partida.
radar.messaging.format=json
radar.messaging.registry-url=http://localhost:8081/apis/registry/v3
# Prazo de cada chamada ao registry, minimo 1 (o cliente do JDK nao tem prazo de leitura): passado o prazo, o produtor deixa as
# linhas esperando e o consumidor tenta o registro de novo, sem mandar para a DLQ. As repeticoes do cliente rodam dentro dele.
radar.messaging.registry-timeout-ms=10000
# Depois de uma falha do registry o consumidor marca os registros Avro na hora, sem chamar o registry, por este tempo (0 desliga);
# assim uma leitura de centenas de registros nao espera o prazo de cada um.
radar.messaging.registry-backoff-ms=5000
# Em producao o registry governa os schemas: com spring.kafka.producer.properties.apicurio.registry.auto-register=false o
# produtor so usa versao ja registrada (precisa de apicurio.registry.find-latest=true) e nunca cria uma.
spring.kafka.producer.value-serializer=br.dev.miguelsanzbr.radar.outbox.adapter.kafka.EnvelopeSerializer
spring.kafka.consumer.value-deserializer=br.dev.miguelsanzbr.radar.outbox.adapter.kafka.EnvelopeDeserializer
spring.kafka.producer.properties.radar.messaging.format=${radar.messaging.format}
spring.kafka.producer.properties.apicurio.registry.url=${radar.messaging.registry-url}
spring.kafka.consumer.properties.apicurio.registry.url=${radar.messaging.registry-url}
spring.kafka.producer.properties.radar.messaging.registry-timeout-ms=${radar.messaging.registry-timeout-ms}
spring.kafka.consumer.properties.radar.messaging.registry-timeout-ms=${radar.messaging.registry-timeout-ms}
spring.kafka.consumer.properties.radar.messaging.registry-backoff-ms=${radar.messaging.registry-backoff-ms}

spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
# why: delivery.timeout.ms must cover linger.ms (5 ms by default since Kafka 4) plus request.timeout.ms
spring.kafka.producer.properties.request.timeout.ms=20000
spring.kafka.producer.properties.delivery.timeout.ms=30000
# why: a producer that cannot reach the broker must fail inside the publish timeout, not after the 60 s default
spring.kafka.producer.properties.max.block.ms=10000
# Threads virtuais no app todo (ADR-0020): Tomcat e @Async. Ouvintes Kafka: os containers criados pelo configurer do Boot
# (alerts-matcher e alerts-notifier) rodam em threads virtuais; o projetor de busca monta a propria fabrica e fica em thread
# de plataforma. O agendador NAO e o virtual do Boot (rodaria todo fixedDelay numa thread so): RadarConfiguration declara um
# pool de plataforma, para o relay do outbox nao disputar thread com o backfill agendado.
spring.threads.virtual.enabled=true
# O bean do scheduler e da aplicacao: so pool.size vale; as demais propriedades spring.task.scheduling.* (shutdown, prefixo) sao ignoradas.
spring.task.scheduling.pool.size=4
# Paginas lidas a frente do processamento na coleta (no maximo o bulkhead do PNCP); o limitador de taxa e o teto real
radar.ingest.fetch-ahead=2

# Cabem em terminationGracePeriodSeconds (30) do chart Helm junto com o preStop
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Coleta agendada: incremental a cada 5 min e fechamento de propostas vencidas a cada 10 min (ADR-0006).
# Os testes desligam as duas em src/test/resources/config/application.properties.
radar.ingest.modalities=6
radar.ingest.incremental.enabled=true
radar.ingest.incremental.interval=5m
radar.ingest.incremental.overlap=15m
radar.ingest.incremental.initial-lookback=P1D
radar.ingest.close-expired.enabled=true
radar.ingest.close-expired.interval=10m
# Particoes mensais de ingest.procurement (sem DEFAULT de proposito): todo dia as 03:15 UTC cria o mes atual e os
# proximos months-ahead; ingest_partitions_ahead e o alerta ParticaoFutura vigiam o resultado (docs/runbook.md#particao-ausente).
radar.ingest.partitions.enabled=true
radar.ingest.partitions.cron=0 15 3 * * *
# months-ahead (padrao 3) fica em PartitionProperties

# Preenchimento de estimated_value_cents (passo 2 do expand-contract, ADR-0010): desligado ate o operador ligar;
# batch-size (padrao 5000) fica em ValueCentsBackfillProperties.
radar.ingest.value-cents-backfill.enabled=false
radar.ingest.value-cents-backfill.interval=10m

# Keycloak (realm radar, infra/keycloak/realm-radar.json). Endpoints explicitos em vez de
# issuer-uri no cliente: a descoberta OIDC rodaria na partida e a aplicacao nao subiria sem o
# Keycloak. As chaves (JWKS) sao buscadas so na primeira validacao.
radar.oidc.issuer=${RADAR_OIDC_ISSUER:http://localhost:8180/realms/radar}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${radar.oidc.issuer}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${radar.oidc.issuer}/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=radar-api
spring.security.oauth2.client.registration.keycloak.client-id=radar-web
spring.security.oauth2.client.registration.keycloak.client-secret=${RADAR_WEB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.keycloak.scope=openid,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.keycloak.authorization-uri=${radar.oidc.issuer}/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=${radar.oidc.issuer}/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${radar.oidc.issuer}/protocol/openid-connect/certs
# CSS e JS das paginas; respostas da API escolhem o proprio Cache-Control (ADR-0019)
spring.web.resources.cache.cachecontrol.max-age=1h
# the stylesheet is linked as /css/app-<hash>.css, so an edit is never served stale from the cache
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**

# why: Flyway creates the read-side role with this password; the search data source logs in with the same one
spring.flyway.placeholders.readWriterPassword=${RADAR_READ_WRITER_PASSWORD:radar_rw_dev}
radar.search.datasource.password=${RADAR_READ_WRITER_PASSWORD:radar_rw_dev}
# conexoes dos dois pools do Hikari (ADR-0010, "Tamanho do pool"): escrita (JPA, coleta, outbox) e busca (leituras e projetor)
spring.datasource.hikari.maximum-pool-size=${RADAR_DB_POOL_SIZE:10}
radar.search.datasource.maximum-pool-size=${RADAR_SEARCH_POOL_SIZE:10}
# Consulta publica da busca que passa disto e cancelada e responde 503 (docs/problems/unavailable.md)
radar.search.statement-timeout=${RADAR_SEARCH_STATEMENT_TIMEOUT:3s}
# quantas das licitacoes mais recentes que casam a busca textual ranqueia (ADR-0011, Perfil e otimizacao)
radar.search.rank-candidates=${RADAR_SEARCH_RANK_CANDIDATES:2000}

# Matcher de alertas (ADR-0015): consome radar.procurement.v1 no grupo alerts-matcher, uma transacao por evento.
# Evento com falha e tentado max-retries vezes e depois vai para radar.procurement.v1.dlq (ADR-0026).
# Desligue (radar.alerts.matcher.enabled=false) durante um backfill historico: os eventos dele nascem agora.
radar.alerts.matcher.enabled=true
radar.alerts.matcher.retry-interval=1s
radar.alerts.matcher.max-retries=3
# Falha de banco ou de transacao e tentada sem limite a cada 5 s (uma queda nunca descarta evento)
radar.alerts.matcher.outage-retry-interval=5s
# Evento mais velho que isso e reconhecido sem trabalho: o grupo comeca no fim do topico e um backlog nao vira alerta novo
radar.alerts.max-event-age=P1D

# E-mail (ADR-0016): Spring Mail para o SMTP do ambiente (Mailpit no compose; SPRING_MAIL_HOST e SPRING_MAIL_PORT sobrescrevem).
# Os prazos impedem que um SMTP lento prenda o ouvinte do notificador.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
radar.mail.from=radar@localhost
# URL publica usada nos links dos e-mails (edital, confirmacao, gerenciar buscas)
radar.public-base-url=${RADAR_PUBLIC_BASE_URL:http://localhost:8080}

# Notificador de alertas: consome radar.alert.v1 no grupo alerts-notifier. INSTANT envia na hora; DAILY espera o resumo.
# Falha de envio: max-retries tentativas extras, a espera dobra a partir de retry-interval (1 s, 2 s, 4 s) e depois o evento
# vai para radar.alert.v1.dlq. Falha de banco e tentada sem limite a cada outage-retry-interval.
radar.alerts.notifier.enabled=true
radar.alerts.notifier.retry-interval=1s
radar.alerts.notifier.max-retries=3
radar.alerts.notifier.outage-retry-interval=5s
# Resumo diario: um e-mail por assinante com os casamentos DAILY ainda nao enviados (fuso America/Sao_Paulo)
radar.alerts.digest.enabled=true
radar.alerts.digest.cron=0 0 7 * * *
# SMTP fora do ar nao tira a aplicacao do ar: o envio tem retentativa e DLQ, entao o servidor de e-mail nao entra no /actuator/health
management.health.mail.enabled=false

# Chaves de API e limite de requisicoes (ADR-0019, ADR-0027). O contador do limite fica no Redis (script Lua atomico).
radar.api-keys.max-per-subject=5
radar.rate-limit.enabled=true
radar.rate-limit.free-per-minute=60
radar.rate-limit.pro-per-minute=600
radar.rate-limit.anonymous-per-minute=30
# So com UM proxy nosso na frente (um salto confiavel): o cliente passa a ser a ultima entrada do X-Forwarded-For, a que o proxy
# acrescentou, desde que seja um IP literal; as entradas a esquerda sao do chamador. Com mais de um proxy encadeado a conta muda (ADR-0027).
radar.http.trust-forwarded=${RADAR_HTTP_TRUST_FORWARDED:false}
# Redis (SPRING_DATA_REDIS_HOST/PORT sobrescrevem). Prazo curto para Redis pendurado; Redis recusando conexao nem espera: o cliente
# rejeita os comandos na hora (RedisClientConfiguration) e o limite abre (ADR-0027). Ele tambem nao entra no /actuator/health, como o SMTP, para nao derrubar a prontidao.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=250ms
spring.data.redis.connect-timeout=250ms
management.health.redis.enabled=false

# Cache do detalhe no Redis (ADR-0027): o que o read model devolve, com TTL; Redis fora faz a leitura cair no Postgres (fail-open).
radar.search.detail-cache.enabled=true
radar.search.detail-cache.ttl=1h

# Flags de funcionalidade (Togglz, ADR-0021). O estado inicial de cada uma e a propriedade antiga do interruptor, entao
# configurar por ambiente continua igual; depois que o operador mexe em /ops/togglz, vale o estado gravado em ops.togglz_feature.
togglz.features.INCREMENTAL_SYNC.label=Coleta incremental
togglz.features.INCREMENTAL_SYNC.enabled=${radar.ingest.incremental.enabled:false}
togglz.features.CLOSE_EXPIRED.label=Fechamento de propostas vencidas
togglz.features.CLOSE_EXPIRED.enabled=${radar.ingest.close-expired.enabled:false}
togglz.features.BACKFILL_SCHEDULED.label=Coleta historica agendada
togglz.features.BACKFILL_SCHEDULED.enabled=${radar.ingest.backfill.scheduled-enabled:false}
togglz.features.ALERT_DIGEST.label=Resumo diario de alertas
togglz.features.ALERT_DIGEST.enabled=${radar.alerts.digest.enabled:true}
togglz.features.MAX_SAVED_SEARCHES_LIMIT.label=Limite de buscas salvas por assinante
togglz.features.MAX_SAVED_SEARCHES_LIMIT.enabled=true
togglz.features.READ_VALUE_CENTS.label=Leitura do valor estimado em centavos
togglz.features.READ_VALUE_CENTS.enabled=false
# Console no caminho do painel de operacao, na porta da aplicacao: o papel operator entra pela sessao OIDC (SecurityConfig)
togglz.console.path=/ops/togglz
togglz.console.use-management-port=false
togglz.console.feature-admin-authority=ROLE_operator
togglz.console.validate-c-s-r-f-token=true

# Painel de operacao (/ops/painel e /ops/health-panel): grupos de consumo cujo atraso o painel mostra
radar.ops.consumer-groups=search-projector,alerts-matcher,alerts-notifier,ops-dlq-recorder
