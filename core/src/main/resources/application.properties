spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# Buckets de latencia da busca para infra/prometheus/rules/slo.yml (le="0.2") e histogram_quantile do dashboard
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,200ms,500ms

radar.outbox.publisher=kafka
radar.outbox.topics.Procurement=radar.procurement.v1
radar.outbox.topics.Alert=radar.alert.v1

spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
# why: delivery.timeout.ms must cover linger.ms (5 ms by default since Kafka 4) plus request.timeout.ms
spring.kafka.producer.properties.request.timeout.ms=20000
spring.kafka.producer.properties.delivery.timeout.ms=30000
# why: a producer that cannot reach the broker must fail inside the publish timeout, not after the 60 s default
spring.kafka.producer.properties.max.block.ms=10000
# O relay do outbox e o backfill agendado nao podem disputar uma unica thread de agendamento
spring.task.scheduling.pool.size=4
