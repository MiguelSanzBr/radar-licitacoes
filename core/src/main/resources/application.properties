spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# prometheus exige o papel operator, como todo o actuator fora health e info (ADR-0019)
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=radar
management.endpoint.health.probes.enabled=true
# Buckets de latencia da busca para infra/prometheus/rules/slo.yml (le="0.2") e histogram_quantile do dashboard
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,200ms,500ms

# Tracing: sample everything (lower it per environment with MANAGEMENT_TRACING_SAMPLING_PROBABILITY)
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
# why: metrics go out by Prometheus scrape and logs by stdout; only spans are pushed over OTLP
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

radar.outbox.publisher=kafka
radar.outbox.topics.Procurement=radar.procurement.v1
radar.outbox.topics.Alert=radar.alert.v1

spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
# why: delivery.timeout.ms must cover linger.ms (5 ms by default since Kafka 4) plus request.timeout.ms
spring.kafka.producer.properties.request.timeout.ms=20000
spring.kafka.producer.properties.delivery.timeout.ms=30000
# why: a producer that cannot reach the broker must fail inside the publish timeout, not after the 60 s default
spring.kafka.producer.properties.max.block.ms=10000
# O relay do outbox e o backfill agendado nao podem disputar uma unica thread de agendamento
spring.task.scheduling.pool.size=4

# Cabem em terminationGracePeriodSeconds (30) do chart Helm junto com o preStop
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Coleta agendada: incremental a cada 5 min e fechamento de propostas vencidas a cada 10 min (ADR-0006).
# Os testes desligam as duas em src/test/resources/config/application.properties.
radar.ingest.modalities=6
radar.ingest.incremental.enabled=true
radar.ingest.incremental.interval=5m
radar.ingest.incremental.overlap=15m
radar.ingest.incremental.initial-lookback=P1D
radar.ingest.close-expired.enabled=true
radar.ingest.close-expired.interval=10m

# Keycloak (realm radar, infra/keycloak/realm-radar.json). Endpoints explicitos em vez de
# issuer-uri no cliente: a descoberta OIDC rodaria na partida e a aplicacao nao subiria sem o
# Keycloak. As chaves (JWKS) sao buscadas so na primeira validacao.
radar.oidc.issuer=${RADAR_OIDC_ISSUER:http://localhost:8180/realms/radar}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${radar.oidc.issuer}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${radar.oidc.issuer}/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=radar-api
spring.security.oauth2.client.registration.keycloak.client-id=radar-web
spring.security.oauth2.client.registration.keycloak.client-secret=${RADAR_WEB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.keycloak.scope=openid,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.keycloak.authorization-uri=${radar.oidc.issuer}/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=${radar.oidc.issuer}/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${radar.oidc.issuer}/protocol/openid-connect/certs
# CSS e JS das paginas; respostas da API escolhem o proprio Cache-Control (ADR-0019)
spring.web.resources.cache.cachecontrol.max-age=1h

# why: Flyway creates the read-side role with this password; the search data source logs in with the same one
spring.flyway.placeholders.readWriterPassword=${RADAR_READ_WRITER_PASSWORD:radar_rw_dev}
radar.search.datasource.password=${RADAR_READ_WRITER_PASSWORD:radar_rw_dev}

# Matcher de alertas (ADR-0015): consome radar.procurement.v1 no grupo alerts-matcher, uma transacao por evento.
# Evento com falha e tentado max-retries vezes e depois descartado com log (a DLQ chega no PR 4.3).
# Desligue (radar.alerts.matcher.enabled=false) durante um backfill historico: os eventos dele nascem agora.
radar.alerts.matcher.enabled=true
radar.alerts.matcher.retry-interval=1s
radar.alerts.matcher.max-retries=3
# Falha de banco ou de transacao e tentada sem limite a cada 5 s (uma queda nunca descarta evento)
radar.alerts.matcher.outage-retry-interval=5s
# Evento mais velho que isso e reconhecido sem trabalho: o grupo comeca no fim do topico e um backlog nao vira alerta novo
radar.alerts.max-event-age=P1D

# E-mail (ADR-0016): Spring Mail para o SMTP do ambiente (Mailpit no compose; SPRING_MAIL_HOST e SPRING_MAIL_PORT sobrescrevem).
# Os prazos impedem que um SMTP lento prenda o ouvinte do notificador.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
radar.mail.from=radar@localhost
# URL publica usada nos links dos e-mails (edital, confirmacao, gerenciar buscas)
radar.public-base-url=${RADAR_PUBLIC_BASE_URL:http://localhost:8080}

# Notificador de alertas: consome radar.alert.v1 no grupo alerts-notifier. INSTANT envia na hora; DAILY espera o resumo.
# Falha de envio: max-retries tentativas extras, a espera dobra a partir de retry-interval (1 s, 2 s, 4 s) e depois o evento
# vai para radar.alert.v1.dlq. Falha de banco e tentada sem limite a cada outage-retry-interval.
radar.alerts.notifier.enabled=true
radar.alerts.notifier.retry-interval=1s
radar.alerts.notifier.max-retries=3
radar.alerts.notifier.outage-retry-interval=5s
# Resumo diario: um e-mail por assinante com os casamentos DAILY ainda nao enviados (fuso America/Sao_Paulo)
radar.alerts.digest.enabled=true
radar.alerts.digest.cron=0 0 7 * * *
# SMTP fora do ar nao tira a aplicacao do ar: o envio tem retentativa e DLQ, entao o servidor de e-mail nao entra no /actuator/health
management.health.mail.enabled=false
