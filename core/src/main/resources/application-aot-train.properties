spring.main.banner-mode=off
spring.flyway.enabled=false
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/aot
spring.datasource.username=aot
spring.datasource.password=aot
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# why: the training run has no broker; do not create topics, do not wait for one, and no relay
spring.kafka.admin.auto-create=false
spring.kafka.admin.fail-fast=false
radar.outbox.relay-enabled=false
