<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Nova licitação</title></head>
<body style="font-family: sans-serif; color: #1a1a1a; max-width: 38rem; margin: 0 auto;">
  <p>Nova licitação para a busca &quot;<strong th:text="${search}">busca</strong>&quot;</p>
  <p th:text="${item.objectDescription}">Objeto</p>
  <ul style="padding-left: 1rem;">
    <li>Órgão: <span th:text="${item.organ}">órgão</span></li>
    <li>Local: <span th:text="${item.place}">local</span></li>
    <li>Valor estimado: <span th:text="${item.value}">valor</span></li>
    <li>Encerramento: <span th:text="${item.closing}">data</span></li>
  </ul>
  <p><a th:href="${item.url}" th:text="${item.url}">link</a></p>
  <hr>
  <p style="font-size: 0.85rem; color: #555;">
    <a th:href="${searchesUrl}">Gerenciar suas buscas</a> |
    <a th:href="${privacyUrl}">Apagar seus dados</a>
  </p>
</body>
</html>
