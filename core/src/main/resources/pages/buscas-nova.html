<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova busca salva | Radar de Licitações</title>
  <link rel="stylesheet" href="/css/alertas.css">
</head>
<body>
  <main>
    <h1>Nova busca salva</h1>
    <form id="form">
      <label>Nome <input type="text" name="name" maxlength="80" required></label>
      <label>Texto da busca <input type="text" name="query" maxlength="200" required></label>
      <label>Frequência
        <select name="frequency">
          <option value="INSTANT">Imediata</option>
          <option value="DAILY">Resumo diário</option>
        </select>
      </label>
      <label>UF <input type="text" name="uf" maxlength="2" pattern="[A-Za-z]{2}"></label>
      <label>Valor mínimo <input type="text" name="minValue" pattern="[0-9]+(\.[0-9]{1,2})?"></label>
      <label>Valor máximo <input type="text" name="maxValue" pattern="[0-9]+(\.[0-9]{1,2})?"></label>
      <label><input type="checkbox" name="open"> somente com propostas abertas</label>
      <button type="submit">Salvar busca</button>
    </form>
    <p id="resultado" role="status" aria-live="polite"></p>
  </main>
  <script src="/js/csrf.js"></script>
  <script src="/js/buscas-nova.js"></script>
</body>
</html>
