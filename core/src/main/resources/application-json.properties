# Structured console logs for the container image; MDC (traceId, spanId, correlationId) is included
logging.structured.format.console=logstash
# why: the image must not start on the development password. No default here: a missing variable fails the boot.
# A mounted secret (configtree) still wins over these lines.
spring.flyway.placeholders.readWriterPassword=${RADAR_READ_WRITER_PASSWORD}
radar.search.datasource.password=${RADAR_READ_WRITER_PASSWORD}
