# Os agendadores de coleta ficam desligados nos testes; os testes que precisam deles ligam por conta propria.
radar.ingest.incremental.enabled=false
radar.ingest.close-expired.enabled=false
radar.ingest.partitions.enabled=false

# O projetor de busca consome o Kafka; os testes que precisam dele ligam por conta propria.
radar.search.projector.enabled=false

# O ouvinte do matcher de alertas fica desligado nos testes; os testes de Kafka dos alertas ligam por conta propria.
radar.alerts.matcher.enabled=false

# O notificador de e-mail e o resumo diario ficam desligados nos testes; os testes de e-mail ligam o ouvinte por conta propria.
radar.alerts.notifier.enabled=false
radar.alerts.digest.enabled=false

# O limite de requisicoes usa Redis e conta por endereco (127.0.0.1 em todo MockMvc): desligado nos testes, os testes dele ligam por conta propria.
radar.rate-limit.enabled=false

# O gravador de DLQ consome o Kafka; os testes que precisam dele ligam por conta propria.
radar.ops.dlq-recorder.enabled=false
