name: nightly

# Fumaca da busca (PR 2.7): 1 minuto do cenario S1 do Gatling contra o compose com uma massa pequena. Detecta
# regressao grosseira (erro, consulta que estoura o timeout); os numeros de verdade saem de `make bench`.
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # O Dockerfile nao tem Docker para o codegen do jOOQ: o modelo e gerado aqui e vai no contexto.
      - name: Gerar o modelo jOOQ
        run: ./mvnw -q -B compile -pl core -am -DskipTests
      - name: Imagem da aplicacao
        run: docker build -t radar-licitacoes:local .
      - name: S1 por 1 minuto com 50 mil linhas
        run: >-
          BENCH_ROWS=50000 BENCH_SCENARIOS=s1 BENCH_EXPLAIN=0 BENCH_WARMUP_S=10 BENCH_MEASURED_S=60
          BENCH_DATE=smoke scripts/bench.sh
      - name: Falha se houve erro
        run: jq -e '[.requests[].errors] | add == 0' docs/benchmarks/latest.json
