name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Coverage exclusion policy
        run: make check-coverage-policy
      - name: Verify
        run: ./mvnw -B verify

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Lint OpenAPI
        run: npx --yes @stoplight/spectral-cli@6 lint contracts/src/main/resources/openapi/radar-api.v1.yaml --fail-severity=warn

  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Lint observability
        run: make lint-observability

  mutation:
    runs-on: ubuntu-latest
    # why: no runner do GitHub o PIT passa de 60 min (so a cobertura leva ~9 min)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Mutation testing
        run: ./mvnw -B -Pmutation verify

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Terraform fmt
        run: make tf-fmt
      - name: Terraform validate
        run: make tf-validate
      - name: tflint
        run: make tf-lint
      - name: Terraform plan contra LocalStack
        run: make tf-plan
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Helm lint e kubeconform
        run: make helm-lint
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # O Dockerfile nao tem Docker para o codegen do jOOQ: o modelo e gerado aqui e vai no contexto.
      - name: Gerar o modelo jOOQ
        run: ./mvnw -q -B compile -pl core -am -DskipTests
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: radar-licitacoes:local
          cache-from: type=gha
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
          version: v0.33.0
          kubectl_version: v1.37.1
      - name: Smoke em kind
        run: make helm-smoke

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: SBOM e Grype (falha em CRITICAL)
        run: make sbom-scan
      - name: Gitleaks (historico e arvore de trabalho)
        run: make secrets-scan

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # O Dockerfile nao tem Docker para o codegen do jOOQ: o modelo e gerado aqui e vai no contexto.
      - name: Gerar o modelo jOOQ
        run: ./mvnw -q -B compile -pl core -am -DskipTests
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: radar-licitacoes:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size
        run: scripts/image-size.sh
      - name: Trivy scan
        run: make image-scan
      - name: Container test
        run: make image-test

  # As imagens dos dois apps (ADR-0028): so constroi, nao publica nem carrega.
  image-split:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [apps/ingestor, apps/search-api]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # O Dockerfile nao tem Docker para o codegen do jOOQ: o modelo e gerado aqui e vai no contexto.
      - name: Gerar o modelo jOOQ
        run: ./mvnw -q -B compile -pl ${{ matrix.module }} -am -DskipTests
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          build-args: MODULE=${{ matrix.module }}
          cache-from: type=gha

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Bloco de numeros do README igual ao latest.json
        run: make docs-check

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Testes dos scripts (shellcheck e bats)
        run: make test-scripts
