<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">Arquitetura hexagonal de um módulo</title>
<desc id="d">O módulo alerts em três camadas: domain no centro, application com casos de uso e ports em volta, e adapters de entrada e saída por fora. As dependências apontam para dentro e as regras são verificadas no build.</desc>
<rect x="1" y="1" width="1198" height="598" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<polygon points="600.0,300.0 460.0,542.5 180.0,542.5 40.0,300.0 180.0,57.5 460.0,57.5" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<polygon points="490.0,300.0 405.0,447.2 235.0,447.2 150.0,300.0 235.0,152.8 405.0,152.8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
<polygon points="400.0,300.0 360.0,369.3 280.0,369.3 240.0,300.0 280.0,230.7 360.0,230.7" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
<text x="320" y="278" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="17" font-weight="700" fill="#065f46" text-anchor="middle">domain</text>
<text x="320" y="296" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Java puro</text>
<text x="320" y="318" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="middle">SavedSearch</text>
<text x="320" y="336" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" fill="#334155" text-anchor="middle">Subscriber</text>
<text x="320" y="180" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="17" font-weight="700" fill="#5b21b6" text-anchor="middle">application</text>
<text x="320" y="199" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">casos de uso</text>
<text x="320" y="215" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">MatchProcurementUseCase</text>
<text x="320" y="404" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">ports</text>
<text x="320" y="422" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">ReverseSearch, AlertMailer</text>
<text x="320" y="95" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="17" font-weight="700" fill="#1e40af" text-anchor="middle">adapter</text>
<text x="320" y="515" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">o módulo alerts como exemplo</text>
<rect x="87.7957166897568" y="224" width="76" height="28" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="125.7957166897568" y="243" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">web</text>
<rect x="52.0" y="286" width="76" height="28" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="90.0" y="305" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">kafka</text>
<rect x="87.7957166897568" y="348" width="76" height="28" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="125.7957166897568" y="367" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">scheduler</text>
<rect x="476.2042833102432" y="224" width="76" height="28" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="514.2042833102432" y="243" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">jdbc</text>
<rect x="512.0" y="286" width="76" height="28" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="550.0" y="305" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">mail</text>
<rect x="476.2042833102432" y="348" width="76" height="28" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="514.2042833102432" y="367" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">outbox</text>
<text x="160" y="188" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">entrada</text>
<text x="480" y="188" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">saída</text>
<text x="650" y="82" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Regras que quebram o build</text>
<text x="650" y="106" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">ArchUnit, Spring Modulith e testes de integração; violar uma regra faz o build falhar.</text>
<circle cx="661" cy="147" r="11" fill="#dcfce7" stroke="#16a34a"/><path d="M655,147 l4,4 l8,-8" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="682" y="152" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">domain</text>
<text x="682" y="172" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">não importa Spring, JPA, Jackson, jOOQ nem Kafka.</text>
<circle cx="661" cy="209" r="11" fill="#dcfce7" stroke="#16a34a"/><path d="M655,209 l4,4 l8,-8" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="682" y="214" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">application</text>
<text x="682" y="234" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">depende só de domain, das próprias ports e de shared.</text>
<circle cx="661" cy="271" r="11" fill="#dcfce7" stroke="#16a34a"/><path d="M655,271 l4,4 l8,-8" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="682" y="276" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">adapter</text>
<text x="682" y="296" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">nunca é importado por domain nem por application.</text>
<circle cx="661" cy="333" r="11" fill="#dcfce7" stroke="#16a34a"/><path d="M655,333 l4,4 l8,-8" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="682" y="338" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">entrada</text>
<text x="682" y="358" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">adapter de entrada não abre transação (@Transactional).</text>
<circle cx="661" cy="395" r="11" fill="#dcfce7" stroke="#16a34a"/><path d="M655,395 l4,4 l8,-8" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="682" y="400" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">módulos</text>
<text x="682" y="420" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">falam por evento ou pela API pública do pacote raiz (Modulith).</text>
<circle cx="661" cy="457" r="11" fill="#dcfce7" stroke="#16a34a"/><path d="M655,457 l4,4 l8,-8" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="682" y="462" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">dados</text>
<text x="682" y="482" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">a busca se conecta ao banco com um papel que só vê o schema search.</text>
<line x1="650" y1="516" x2="1160" y2="516" stroke="#e2e8f0"/>
<text x="650" y="542" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">As dependências apontam para dentro: trocar Postgres, Kafka ou SMTP</text>
<text x="650" y="562" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" font-weight="400" fill="#334155" text-anchor="start">mexe só no adapter; o domínio e os casos de uso não mudam.</text>
</svg>
