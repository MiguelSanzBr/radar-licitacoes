<text x="1080" y="128" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">search-api</text>
<text x="1080" y="147" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">porta 8080</text>
