<text x="640" y="52" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">PROFILE=split make up</text>
<text x="640" y="76" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Os mesmos módulos em dois processos; só o ingestor publica (ADR-0028).</text>
