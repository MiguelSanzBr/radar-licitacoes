<rect x="1015" y="200" width="130" height="34" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/><text x="1080.0" y="222" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">alerts</text>
<rect x="1015" y="238" width="130" height="34" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/><text x="1080.0" y="260" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">identity</text>
<rect x="1015" y="276" width="130" height="34" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/><text x="1080.0" y="298" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">outbox (grava)</text>
<rect x="1015" y="314" width="130" height="34" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/><text x="1080.0" y="336" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">ops</text>
