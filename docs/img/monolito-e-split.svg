<rect x="655" y="206" width="130" height="34" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/><text x="720.0" y="228" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">outbox (relay)</text>
<rect x="655" y="250" width="130" height="34" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/><text x="720.0" y="272" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">ops</text>
<text x="720" y="320" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">dono do Flyway</text>
