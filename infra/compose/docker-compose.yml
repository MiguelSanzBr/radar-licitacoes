# Ambiente oficial: `make up` (ver ADR-0022). Tudo em localhost; os segredos e o .env saem de
# scripts/compose-init.sh. Limites de memoria medidos em docs/benchmarks/compose-memory.md.
name: radar

services:
  postgres:
    image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    # wal_level=logical so e usado pelo Debezium (perfil cdc, ADR-0018); para o relay por polling nao tem custo relevante.
    # max_slot_wal_keep_size: um slot parado invalida em vez de encher o disco com WAL retido.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=100
      - -c
      - wal_level=logical
      - -c
      - max_slot_wal_keep_size=1GB
    environment:
      POSTGRES_USER: radar
      POSTGRES_DB: radar
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      # Postgres 18: o volume vai em /var/lib/postgresql (o PGDATA fica numa subpasta por versao)
      - pgdata:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0@sha256:bff074a5d0051dbc0bbbcd25b045bb1fe84833ec0d3c7c965d1797dd289ec88f
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    ports: ["127.0.0.1:9094:9094"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    # Contador do limite de requisicoes da API publica (ADR-0027); sem persistencia de proposito: perder o estado so devolve o balde cheio.
    # volatile-ttl: toda chave da aplicacao tem TTL, entao com a memoria cheia o Redis descarta as que expiram primeiro
    # (o padrao noeviction recusaria a escrita e o limite passaria a abrir para todos).
    image: redis:8.8-alpine@sha256:dc95ea2fcf5d5c4253be0f967c28143d0f625846197eed2fd32c748eb99abfca
    command: ["redis-server", "--save", "", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl"]
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Mesma URL para o navegador e para o claim iss dos tokens; a aplicacao fala com o Keycloak
      # por http://keycloak:8080 (chaves e troca de codigo), ver o servico app.
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms64m -Xmx384m
    volumes:
      - ../keycloak/realm-radar.json:/opt/keycloak/data/import/realm-radar.json:ro
    ports: ["127.0.0.1:8180:8080"]
    mem_limit: 896m
    healthcheck:
      # a imagem nao tem curl: o endpoint de saude (porta de gerenciamento 9000) via /dev/tcp
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-lgtm:
    # Grafana, Prometheus, Loki, Tempo, Pyroscope e o coletor OTLP numa imagem. A aplicacao envia
    # metricas, traces e logs por OTLP (porta 4318); nao ha scrape. Os dashboards de infra/grafana
    # entram pelo provisionamento e usam o datasource Prometheus da imagem (uid prometheus).
    image: grafana/otel-lgtm:0.36.0@sha256:57c04cbd8e7022f32bb84c4ac005d79baf8b08e2c5be44facf11f5f1f9944ba2
    volumes:
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ../grafana/provisioning/dashboards/radar.yml:/otel-lgtm/grafana/conf/provisioning/dashboards/radar.yaml:ro
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 1792m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 15s

  pncp-fixture:
    # Faz o papel do PNCP: serve o dia gravado em seed/ (dados publicos do PNCP, coletados em
    # 2026-10-22, publicacoes de 2026-10-21, modalidade 6) e responde 204 para qualquer outra janela.
    image: wiremock/wiremock:3.13.2-alpine@sha256:f8c42a38dca3f4a1d7219af11c80438740f39eebb1505b0f029aed743c20e147
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /home/wiremock/__files
        zcat /seed/*.jsonl.gz | awk '{ f = "/home/wiremock/__files/page-" NR ".json"; print > f; close(f) }'
        exec /docker-entrypoint.sh --local-response-templating --no-request-journal --disable-banner
    environment:
      JAVA_OPTS: -Xms32m -Xmx128m
    volumes:
      - ./seed:/seed:ro
      - ./pncp-fixture/mappings:/home/wiremock/mappings:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/__admin/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  app: &radar-app
    image: radar-licitacoes:${RADAR_TAG:-local}  # RADAR_TAG vem do ambiente (make exporta)
    pull_policy: never
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      pncp-fixture: {condition: service_healthy}
      otel-lgtm: {condition: service_healthy}
    secrets:
      - source: db_password
        target: spring.datasource.password
      # o papel radar_read_writer nasce na migration V6 com este valor (placeholder) e a busca
      # entra com ele (configtree: o nome do arquivo e a propriedade)
      - source: read_writer_password
        target: spring.flyway.placeholders.readWriterPassword
      - source: read_writer_password
        target: radar.search.datasource.password
    environment: &radar-env
      SPRING_APPLICATION_NAME: radar-licitacoes
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/radar
      SPRING_DATASOURCE_USERNAME: radar
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      # polling (relay da aplicacao) ou cdc (Debezium, perfil cdc): nunca os dois (ADR-0018); make exporta cdc com PROFILE=cdc
      RADAR_OUTBOX_MODE: ${RADAR_OUTBOX_MODE:-polling}
      # json (padrao) ou avro (ADR-0024); avro pede o perfil layer3 (Apicurio) e `make schemas-register`. O cdc fica em JSON.
      RADAR_MESSAGING_FORMAT: ${RADAR_MESSAGING_FORMAT:-json}
      RADAR_MESSAGING_REGISTRY_URL: http://apicurio:8080/apis/registry/v3
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      # Emissor = URL do navegador; chaves e token pelo nome do servico (back-channel)
      RADAR_OIDC_ISSUER: ${RADAR_OIDC_ISSUER}
      RADAR_WEB_CLIENT_SECRET: ${RADAR_WEB_CLIENT_SECRET}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/radar/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWKSETURI: http://keycloak:8080/realms/radar/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKENURI: http://keycloak:8080/realms/radar/protocol/openid-connect/token
      # O PNCP do compose e a fixture (sem rede externa); o padrao de 0,2 req/s (ADR-0017) vale so para o PNCP real
      RADAR_PNCP_BASE_URL: http://pncp-fixture:8080
      RADAR_PNCP_REQUESTS_PER_SECOND: "20"
      # Telemetria por push para o otel-lgtm (o /actuator/prometheus exige o papel operator)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "true"
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://otel-lgtm:4318/v1/metrics
      MANAGEMENT_OTLP_METRICS_EXPORT_STEP: 15s
      # Os dashboards e as regras usam *_seconds: sem isto o OTLP traz *_milliseconds
      MANAGEMENT_OTLP_METRICS_EXPORT_BASE_TIME_UNIT: seconds
    ports: ["127.0.0.1:8080:8080"]
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  # Perfil split (ADR-0028): a mesma plataforma em dois servicos, no lugar do monolito. `make up PROFILE=split` sobe estes
  # dois e o make passa --scale app=0 (o `app` nao tem perfil, para o resto das ferramentas continuar vendo o monolito).
  # Herdam do `app` o ambiente, os segredos e as dependencias; o ingestor e dono das migrations, entao a search-api espera por ele.
  ingestor:
    <<: *radar-app
    image: radar-licitacoes-ingestor:${RADAR_TAG:-local}
    profiles: [split]
    environment:
      <<: *radar-env
      SPRING_APPLICATION_NAME: radar-ingestor
    ports: ["127.0.0.1:8082:8080"]
    # 512m deixava o pico do cgroup (481 MiB, com cache de pagina) a 6% do limite; medido em docs/benchmarks/compose-memory.md
    mem_limit: 576m

  search-api:
    <<: *radar-app
    image: radar-licitacoes-search-api:${RADAR_TAG:-local}
    profiles: [split]
    depends_on:
      ingestor: {condition: service_healthy}
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      otel-lgtm: {condition: service_healthy}
    environment:
      <<: *radar-env
      SPRING_APPLICATION_NAME: radar-search-api
    ports: ["127.0.0.1:8080:8080"]
    mem_limit: 640m

  apicurio:
    # Camada 3 (ADR-0024): o registro de schemas sobe so com `--profile layer3` e a aplicacao so o usa com RADAR_MESSAGING_FORMAT=avro.
    # A regra padrao BACKWARD vale para todo grupo; `make schemas-register` poe a regra explicita em cada grupo de topico.
    image: apicurio/apicurio-registry:3.3.3@sha256:c9cae4c90ce46538abf673c68eb591345f23bcc6c2aa6bfd47189adcf609d8f1
    profiles: [layer3]
    environment:
      APICURIO_RULES_GLOBAL_COMPATIBILITY: BACKWARD
    ports: ["127.0.0.1:8081:8080"]
    mem_limit: 512m

  cdc-setup:
    # Aplica infra/cdc/enable-cdc.sql (coluna envelope e publicacao) depois que a aplicacao subiu e o Flyway criou a tabela,
    # e antes do Debezium. Linhas gravadas pela aplicacao antes deste passo terminar nao saem (nao ha relay nem slot ainda):
    # num ambiente novo nada grava nesse intervalo; num ambiente com dados, siga o runbook (Trocar o modo do outbox).
    image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    profiles: [cdc]
    restart: "no"
    depends_on:
      app: {condition: service_healthy}
    secrets: [db_password]
    volumes:
      - ../cdc:/cdc:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - PGPASSWORD="$$(cat /run/secrets/db_password)" psql -h postgres -U radar -d radar -v ON_ERROR_STOP=1 -f /cdc/enable-cdc.sql
    mem_limit: 64m

  debezium:
    # Alternativa ao relay (ADR-0018): sobe so com `PROFILE=cdc make up`, que tambem poe a aplicacao em modo cdc.
    # Kafka Connect standalone com o conector Postgres; a senha vem do segredo, nao de variavel.
    image: quay.io/debezium/connect:3.6.3.Final@sha256:ebce73ac34e4f688cdbbc46713020794fe876c260cbf5063c66e2b0f6a5b6ef5
    profiles: [cdc]
    entrypoint: ["/kafka/bin/connect-standalone.sh"]
    command: ["/config/worker.properties", "/config/connector.properties"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      cdc-setup: {condition: service_completed_successfully}
    secrets: [db_password]
    environment:
      KAFKA_HEAP_OPTS: -Xms64m -Xmx256m
      KAFKA_LOG4J_OPTS: -Dlog4j2.configurationFile=/kafka/config.orig/connect-log4j2.yaml
    volumes:
      - ../cdc:/config:ro
      - cdcdata:/kafka/data
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors/radar-outbox/status | grep -q '\"tasks\":\\[{\"id\":0,\"state\":\"RUNNING\"'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

secrets:
  db_password:
    file: ./secrets/db_password
  read_writer_password:
    file: ./secrets/read_writer_password

volumes:
  pgdata:
  cdcdata:
