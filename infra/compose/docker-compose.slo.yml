# Ajustes so da medicao de SLO (scripts/slo.sh, make slo): sobrepoe docker-compose.yml.
# Nada daqui vale para o ambiente de desenvolvimento nem para o deploy.
services:
  postgres:
    # 200 mil linhas com indices GIN nao cabem nos 256 MB do compose de desenvolvimento; com menos memoria a medicao seria do disco.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=100
      - -c
      - wal_level=logical
      - -c
      - max_slot_wal_keep_size=1GB
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
    mem_limit: 1g

  pncp-fixture:
    # O scripts/slo.sh importa aqui o mapeamento de atualizacoes novas (infra/compose/pncp-fixture/slo) pela API administrativa.
    ports: ["127.0.0.1:8089:8080"]

  app:
    environment:
      # ~22 req/s de um unico IP passariam do balde anonimo (ADR-0027): o limite tem o proprio teste
      RADAR_RATE_LIMIT_ENABLED: "false"
      # a coleta incremental le o PNCP simulado a cada tick; o padrao da aplicacao e 5m (ADR-0006)
      RADAR_INGEST_INCREMENTAL_INTERVAL: ${SLO_INTERVAL:-30s}
