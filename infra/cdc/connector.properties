# Debezium Postgres lendo outbox.outbox_event pelo WAL (pgoutput) e publicando o mesmo registro que
# o relay: topico por aggregate_type, chave aggregate_id, valor a coluna envelope (ADR-0018).
name=radar-outbox
connector.class=io.debezium.connector.postgresql.PostgresConnector
tasks.max=1

database.hostname=postgres
database.port=5432
database.user=radar
database.password=${directory:/run/secrets:db_password}
database.dbname=radar
topic.prefix=radar

# A publicacao nasce em infra/cdc/enable-cdc.sql (so INSERT, so as colunas do roteador); o slot nasce
# no primeiro start do conector e retem WAL enquanto o conector estiver parado.
plugin.name=pgoutput
slot.name=radar_outbox
publication.name=radar_outbox
publication.autocreate.mode=disabled
table.include.list=outbox.outbox_event
# Sem snapshot: linhas anteriores ao slot sao do relay (publicadas antes da troca de modo).
snapshot.mode=no_data
# Sem o batimento o slot nao avanca quando o outbox esta parado e outras tabelas recebem escrita (medido:
# 64 MB de lag parados por 30 s com so heartbeat.interval.ms): o servidor so envia o que esta na
# publicacao. A query escreve na tabela do batimento, que esta na publicacao, e o conector confirma o LSN.
heartbeat.interval.ms=10000
heartbeat.action.query=WITH beat AS (INSERT INTO outbox.cdc_heartbeat (beat) VALUES (now())) DELETE FROM outbox.cdc_heartbeat WHERE beat < now() - interval '1 minute'
tombstones.on.delete=false
extended.headers.enabled=false

transforms=outbox,dropid,procurement,alert
transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
transforms.outbox.table.field.event.id=event_id
transforms.outbox.table.field.event.key=aggregate_id
transforms.outbox.table.field.event.payload=envelope
transforms.outbox.route.by.field=aggregate_type
transforms.outbox.route.topic.replacement=$1
transforms.outbox.table.fields.additional.placement=event_id:header:eventId,event_type:header:eventType,schema_version:header:schemaVersion
# O roteador sempre grava o cabecalho id (o mesmo event_id); o relay nao o grava.
transforms.dropid.type=org.apache.kafka.connect.transforms.DropHeaders
transforms.dropid.headers=id
# aggregate_type vira o topico: os mesmos nomes de radar.outbox.topics.* da aplicacao.
transforms.procurement.type=org.apache.kafka.connect.transforms.RegexRouter
transforms.procurement.regex=Procurement
transforms.procurement.replacement=radar.procurement.v1
transforms.alert.type=org.apache.kafka.connect.transforms.RegexRouter
transforms.alert.regex=Alert
transforms.alert.replacement=radar.alert.v1
