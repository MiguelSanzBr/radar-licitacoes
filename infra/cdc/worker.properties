# Kafka Connect em modo standalone (ADR-0018): um processo, sem topicos internos e sem chamada REST
# de cadastro. Chaves, valores e cabecalhos saem como texto puro, igual ao que o relay grava.
bootstrap.servers=kafka:9092
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.storage.StringConverter
header.converter=org.apache.kafka.connect.storage.StringConverter
offset.storage.file.filename=/kafka/data/offsets.dat
offset.flush.interval.ms=1000
plugin.path=/kafka/connect
# A senha do banco vem do arquivo de segredo montado em /run/secrets, nunca destas propriedades.
config.providers=directory
config.providers.directory.class=org.apache.kafka.common.config.provider.DirectoryConfigProvider
