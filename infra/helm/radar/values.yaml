image:
  repository: radar-licitacoes
  tag: local
  pullPolicy: IfNotPresent

# Uma replica so: o monolito roda agendadores (coleta, resumo diario, limpeza do outbox) e o replay em memoria, que
# assumem um unico processo. O chart recusa replicaCount > 1 e autoscaling.enabled ate haver um Deployment por app (ADR-0028).
replicaCount: 1
# So para renderizar o HPA e o PDB nos testes do chart (make helm-lint). Nao ligue em um cluster de verdade.
allowMultipleReplicas: false

serviceAccount:
  create: true
  name: ""

service:
  port: 80

# Variaveis de ambiente nao secretas (ConfigMap). Postgres e externo: aponte o URL para o seu.
# Alem do banco e do Kafka, defina aqui o que muda por ambiente (inventario completo em docs/config-12-factor.md):
# RADAR_OIDC_ISSUER, RADAR_PNCP_BASE_URL, SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_DATA_REDIS_HOST, OTEL_EXPORTER_OTLP_ENDPOINT.
# O Redis e externo e precisa de maxmemory-policy volatile-ttl (toda chave tem TTL; ADR-0027): com noeviction o limite deixa de medir.
config:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/radar
  # Atras de um Ingress (um proxy nosso na frente), o cliente do limite de taxa e a ultima entrada do X-Forwarded-For.
  # Se o Service for exposto direto, sem proxy, ponha "false": senao o cabecalho vira forjavel (ADR-0027).
  RADAR_HTTP_TRUST_FORWARDED: "true"
  # Endereco publico, usado nos links dos e-mails; troque pelo host do Ingress.
  RADAR_PUBLIC_BASE_URL: https://radar.example.com
  RADAR_MAIL_FROM: radar@example.com
  # Formato dos eventos: json ou avro (ADR-0024). O registry so e usado com avro.
  RADAR_MESSAGING_FORMAT: json
  RADAR_MESSAGING_REGISTRY_URL: http://apicurio:8080/apis/registry/v3
  # Quem publica o outbox: polling (o relay do app) ou cdc (Debezium, ADR-0018). Nunca os dois.
  RADAR_OUTBOX_MODE: polling
  # Conexoes dos pools do Hikari (ADR-0010): busca e escrita.
  RADAR_SEARCH_POOL_SIZE: "10"
  RADAR_DB_POOL_SIZE: "10"

# Kafka e externo: vira SPRING_KAFKA_BOOTSTRAP_SERVERS no ConfigMap.
kafka:
  bootstrapServers: kafka:9092

# Credenciais (Secret). Com create=true o chart cria o Secret a partir de values; com create=false
# existingName e obrigatorio e deve ter SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD.
# Em producao ponha tambem RADAR_READ_WRITER_PASSWORD (obrigatoria na imagem) e RADAR_WEB_CLIENT_SECRET.
secret:
  create: false
  existingName: ""
  values: {}

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 768Mi

# Termino: preStop (drenagem do endpoint) + shutdownPhaseSeconds precisam caber em
# terminationGracePeriodSeconds; o template falha se nao couberem.
terminationGracePeriodSeconds: 30
preStopSleepSeconds: 5
# Deve igualar spring.lifecycle.timeout-per-shutdown-phase da aplicacao (20s).
shutdownPhaseSeconds: 20

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

podAnnotations: {}
