# Valores do smoke em kind: imagem carregada com `kind load`, Postgres descartavel do cluster.
image:
  pullPolicy: Never
# Sem broker no kind (RAM): o admin do Kafka nao pode derrubar a subida nem criar topicos.
config:
  SPRING_KAFKA_ADMIN_FAIL_FAST: "false"
  SPRING_KAFKA_ADMIN_AUTO_CREATE: "false"
  # sem broker, os consumidores nao sobem (o DNS de kafka:9092 nao resolve) e o relay nao publica
  RADAR_SEARCH_PROJECTOR_ENABLED: "false"
  RADAR_ALERTS_MATCHER_ENABLED: "false"
  RADAR_ALERTS_NOTIFIER_ENABLED: "false"
  RADAR_OPS_DLQRECORDER_ENABLED: "false"
  RADAR_OUTBOX_RELAYENABLED: "false"
  # sem PNCP no smoke: uma coleta em andamento segura o taskScheduler e estoura o tempo de saida
  RADAR_INGEST_INCREMENTAL_ENABLED: "false"
  RADAR_INGEST_CLOSEEXPIRED_ENABLED: "false"
  RADAR_INGEST_PARTITIONS_ENABLED: "false"
secret:
  create: true
  values:
    SPRING_DATASOURCE_USERNAME: radar
    SPRING_DATASOURCE_PASSWORD: radar-smoke
    # a imagem (perfil json) nao sobe sem esta senha
    RADAR_READ_WRITER_PASSWORD: radar-smoke-rw
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 768Mi
